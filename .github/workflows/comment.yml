name: COMMENT

on:
  issue_comment:
    types: [created]

jobs:
  push-comment:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'pick')
    steps:
      - uses: actions/checkout@v3
      - id: title
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          title=$(printf '%s' "$ISSUE_TITLE" | sed "s/\"/\\\'/g")
          delimiter="TITLE_EOF_$RANDOM$RANDOM"
          { echo "title<<$delimiter"; printf '%s\n' "$title"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - id: body
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          body=$(printf '%s' "$COMMENT_BODY" | sed "s/\"/\\\'/g")
          delimiter="BODY_EOF_$RANDOM$RANDOM"
          { echo "body<<$delimiter"; printf '%s\n' "$body"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - name: Send dingding notify
        uses: zcong1993/actions-ding@master
        with:
          dingToken: ${{ secrets.PICKER_DINGTALK_KEY }}
          secret: ${{ secrets.PICKER_DINGTALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                  "text": " ${{ github.event.comment.user.login }} 评论了 [${{ steps.title.outputs.title }}](${{ github.event.comment.html_url }}): \n\n${{ steps.body.outputs.body }}",
                  "title": "${{ steps.title.outputs.title }} 新增评论"
              }
            }
