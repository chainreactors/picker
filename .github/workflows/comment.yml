name: COMMENT

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  push-comment:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'pick')
    steps:
      - name: Build notification
        id: notification
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          title = event["issue"]["title"]
          comment = event["comment"]
          payload = {
              "msgtype": "markdown",
              "markdown": {
                  "title": f"{title} 新增评论",
                  "text": (
                      f" {comment['user']['login']} 评论了 "
                      f"[{title}]({comment['html_url']}):\n\n"
                      f"{comment['body']}"
                  ),
              },
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("body=" + json.dumps(payload, ensure_ascii=True) + "\n")
          PY
      - name: Send dingding notify
        uses: zcong1993/actions-ding@d4587a67d30b6bf767cd4ed338d17d7237c18a74
        with:
          dingToken: ${{ secrets.PICKER_DINGTALK_KEY }}
          secret: ${{ secrets.PICKER_DINGTALK_SECRET }}
          body: ${{ steps.notification.outputs.body }}
